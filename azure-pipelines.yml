trigger:
  branches:
    include:
      - "*"

resources:
  repositories:
    - repository: templates
      type: github
      name: cbnr-devops/AZDO-templates
      endpoint: cbnr-devops

variables:
  - group: security-keys
  - name: IMAGE_NAME
    value: solar-system
  - name: IMAGE_TAG
    value: $(Build.BuildId)
  - name: ACR_NAME
    value: skssolar

pool:
  name: central-infra-mdp
  demands:
    - ImageOverride -equals central-custom-linux

stages:
- stage: Build
  jobs:
    - job: BuildJob
      steps:
        - template: templates/checkout.yml@templates
        - template: templates/install.yml@templates
        - template: templates/owasp.yml@templates
          parameters:
            nvdApiKey: $(NVD_API_KEY)
        - template: templates/test.yml@templates
        # SonarCloud and its quality gate can be restored when required.

        - template: templates/docker-build.yml@templates
          parameters:
            imageName: $(IMAGE_NAME)
            tag: $(IMAGE_TAG)

        - template: templates/trivy.yml@templates
          parameters:
            imageName: $(IMAGE_NAME)
            tag: $(IMAGE_TAG)

        - template: templates/acr-push.yml@templates
          parameters:
            imageName: $(IMAGE_NAME)
            tag: $(IMAGE_TAG)
            acrName: $(ACR_NAME)


- stage: Deploy_Dev
  dependsOn: Build
  jobs:
    - job: DeployDev
      steps:
        - template: templates/deploy.yml@templates
          parameters:
            aksCluster: dev-cluster
            resourceGroup: central-dev-rg
            acrName: $(ACR_NAME)
            imageName: $(IMAGE_NAME)
            tag: $(IMAGE_TAG)
            namespace: dev
            helmPath: ./helm/solar-system
            deploymentStrategy: blueGreen
            wait: true
            atomic: true
            timeout: 10m


- stage: Approval
  dependsOn: Deploy_Dev
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))

  jobs:
    - job: Wait
      pool: server
      steps:
        - task: ManualValidation@0
          inputs:
            instructions: "Approve deployment to STAGING"
            timeoutInMinutes: 10


- stage: Deploy_Staging
  dependsOn: Approval
  condition: and(succeeded(), eq(variables['Build.SourceBranchName'], 'main'))

  jobs:
    - job: DeployStaging
      steps:
        - template: templates/deploy.yml@templates
          parameters:
            aksCluster: staging-cluster
            resourceGroup: central-staging-rg
            acrName: $(ACR_NAME)
            imageName: $(IMAGE_NAME)
            tag: $(IMAGE_TAG)
            namespace: staging
            helmPath: ./helm/solar-system
            deploymentStrategy: blueGreen
            wait: true
            atomic: true
            timeout: 10m
