replicaCount: 2
app: solar-system
env: dev

image:
  repository: ""
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  labels:
    tier: backend
    env: dev

blueGreen:
  enabled: true
  activeSlot: blue
  slots:
    blue:
      imageTag: ""
    green:
      imageTag: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  cpuUtilization: 70
  memoryUtilization: 80
